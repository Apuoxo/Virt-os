name: ReactOS NT baseline ISO

on:
  push:
    branches:
      - nt-foundation/reactos-baseline
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reactos-baseline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-iso:
    name: Build x64 baseline ISO
    runs-on: windows-latest
    timeout-minutes: 240
    steps:
      - name: Checkout Virt OS workflow
        uses: actions/checkout@v6

      - name: Checkout pinned ReactOS source
        uses: actions/checkout@v6
        with:
          repository: reactos/reactos
          ref: c25e4fd7dec339106adb214c4f993f70f04391e4
          path: src
          persist-credentials: false

      - name: Install Ninja
        shell: pwsh
        run: choco install ninja -y --no-progress

      - name: Install Flex and Bison
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'flexbison.7z'
          $urls = @(
            'https://svn.reactos.org/storage/vperevertkin/flexbison.7z',
            'https://web.archive.org/web/2025if_/https://svn.reactos.org/storage/vperevertkin/flexbison.7z'
          )
          $downloaded = $false
          foreach ($url in $urls) {
            try {
              Invoke-WebRequest -Uri $url -OutFile $archive
              if ((Get-Item $archive).Length -gt 100000) {
                $downloaded = $true
                break
              }
            } catch {
              Write-Warning "Download failed: $url"
            }
          }
          if (-not $downloaded) { throw 'Could not download the ReactOS Flex/Bison tool archive.' }
          7z x $archive "-o$env:RUNNER_TEMP\flexbison" -y
          "$env:RUNNER_TEMP\flexbison" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "BISON_PKGDATADIR=$env:RUNNER_TEMP\flexbison\share\bison" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "M4=$env:RUNNER_TEMP\flexbison\m4.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Configure ReactOS
        shell: pwsh
        run: |
          cmake -S src -B build -G Ninja `
            -DCMAKE_TOOLCHAIN_FILE:FILEPATH=src/toolchain-msvc.cmake `
            -DARCH:STRING=amd64 `
            -DCMAKE_BUILD_TYPE=Debug `
            -DDLL_EXPORT_VERSION=0x600 `
            -DENABLE_ROSTESTS=1 `
            -DENABLE_ROSAPPS=1

      - name: Build bootable ISO
        shell: pwsh
        run: cmake --build build --target bootcd --parallel 2

      - name: Validate ISO artifact
        shell: pwsh
        run: |
          $iso = Join-Path $env:GITHUB_WORKSPACE 'build\bootcd.iso'
          if (-not (Test-Path $iso)) { throw 'Build completed without build/bootcd.iso.' }
          $item = Get-Item $iso
          if ($item.Length -lt 1048576) { throw "ISO is unexpectedly small: $($item.Length) bytes" }
          Get-FileHash $iso -Algorithm SHA256 | Format-List
          "ISO_BYTES=$($item.Length)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "UPSTREAM_COMMIT=c25e4fd7dec339106adb214c4f993f70f04391e4" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Upload baseline ISO and build logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reactos-baseline-amd64-${{ github.sha }}
          path: |
            build/bootcd.iso
            build/CMakeCache.txt
          if-no-files-found: warn
          retention-days: 14
